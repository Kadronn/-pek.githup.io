<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        .products {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .product {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 200px;
            margin: 10px;
            padding: 15px;
            text-align: center;
        }
        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product h3 {
            margin: 10px 0;
        }
        .product p {
            font-size: 14px;
            color: #777;
        }
        .product button {
            background-color: #333;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>My Online Shop</h1>
    <p>Your one-stop shop for amazing products!</p>
</header>

<div class="products">
    <div class="product">
        <img src="https://via.placeholder.com/200x150" alt="Product 1">
        <h3>Product 1</h3>
        <p>$19.99</p>
        <button>Order Now</button>
    </div>
    <div class="product">
        <img src="https://via.placeholder.com/200x150" alt="Product 2">
        <h3>Product 2</h3>
        <p>$29.99</p>
        <button>Order Now</button>
    </div>
    <div class="product">
        <img src="https://via.placeholder.com/200x150" alt="Product 3">
        <h3>Product 3</h3>
        <p>$39.99</p>
        <button>Order Now</button>
    </div>
</div>

<footer>
    <p>© 2025 My Online Shop. All rights reserved.</p>
</footer>

</body>
</html>
